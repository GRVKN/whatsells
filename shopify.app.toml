client_id = "1dfbc735ceb18b0533513dbc335cc23a"
name = "WhatSells"
application_url = "https://app.whatsells.dev"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-04"

[[webhooks.subscriptions]]
topics = [ "app/uninstalled" ]
uri = "/webhooks/app/uninstalled"

[[webhooks.subscriptions]]
topics = [ "app/scopes_update" ]
uri = "/webhooks/app/scopes_update"

[[webhooks.subscriptions]]
topics = [ "orders/create" ]
uri = "/webhooks/orders/create"

[[webhooks.subscriptions]]
topics = [ "refunds/create", "orders/cancelled" ]
uri = "/webhooks/orders/reconcile"

[[webhooks.subscriptions]]
compliance_topics = [
  "customers/data_request",
  "customers/redact",
  "shop/redact"
]
uri = "/webhooks/compliance"

[access_scopes]
scopes = "read_orders,read_products"

[auth]
redirect_urls = [
  "https://app.whatsells.dev/auth/callback"
]
